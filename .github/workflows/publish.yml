name: Publish to GitHub Packages
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          # Note: actions/setup-node does not support bun caching
      - name: Configure .npmrc for GitHub Packages
        run: |
          cat > ~/.npmrc << EOF
          @davissylvester:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          EOF
      - name: Install dependencies (bun)
        run: bun install
      - name: Run tests
        run: bun run test -- --passWithNoTests
      - name: Build
        run: bun run build
      - name: Guard against duplicate version
        run: |
          V=$(jq -r '.version' package.json)
          if npm view --registry=https://npm.pkg.github.com \
              @davissylvester/aws-constructs@"$V" version >/dev/null 2>&1; then
            echo "Version $V already published"; exit 1;
          fi
          echo "Publishing version $V"
      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
